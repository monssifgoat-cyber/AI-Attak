version: "3.9"
services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports: ["8080:8080"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    # في HF Spaces استخدم ollama/ollama:rocm أو أزل هذا الخدمة واستخدم gemini

  team:
    build: .
    depends_on: [zap, ollama]
    volumes:
      - .:/app
      - ./output:/app/output
      - ./reports:/app/reports
    environment:
      - OLLAMA_HOST=http://ollama:11434

volumes:
  ollama:
